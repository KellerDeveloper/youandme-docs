<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You&amp;Me — вход</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  Страница возврата после входа через VK ID.

  Обычно её не видно: iOS перехватывает этот адрес по universal link и открывает
  приложение, а сюда человек попадает только если приложения на устройстве нет
  или связь домена с ним ещё не подхватилась. Поэтому текст — не «загрузка»,
  а объяснение, что делать дальше.
-->
<main class="page">
  <h1>Вход в You&amp;Me</h1>
  <p>Если приложение не открылось само, вернитесь в него вручную — вход уже подтверждён.</p>
  <p><a href="/">На главную</a></p>
</main>
</body>
</html>
